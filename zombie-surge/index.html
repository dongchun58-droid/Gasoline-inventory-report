<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>ZOMBIE SURGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
  :root{--blue:#2f8fd6;--yellow:#ffd23f;--red:#e0503a;--ink:#eaf2f8}
  html,body{margin:0;height:100%;background:#07090c;color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block}
  .disp{font-family:"Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.03em}
  #hud{position:fixed;inset:0;pointer-events:none}
  #hud>*{position:absolute}
  #stageLbl{top:max(10px,env(safe-area-inset-top));left:14px;font-size:16px;font-weight:700;opacity:.9}
  #prog{top:calc(max(10px,env(safe-area-inset-top)) + 26px);left:14px;width:180px;height:6px;background:#ffffff22;border-radius:3px;overflow:hidden}
  #progFill{height:100%;width:0;background:var(--blue)}
  #troops{top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center}
  #troopsN{font-size:56px;line-height:1;font-weight:800;color:#8fd6ff;text-shadow:0 2px 10px #0a3a66,0 0 2px #fff}
  #weapon{font-size:14px;font-weight:700;color:#cfe8ff;margin-top:2px;letter-spacing:.08em}
  #coins{top:max(10px,env(safe-area-inset-top));right:14px;font-size:18px;font-weight:700;color:var(--yellow)}
  #bossBar{top:calc(max(8px,env(safe-area-inset-top)) + 84px);left:50%;transform:translateX(-50%);width:min(520px,70vw);display:none;text-align:center}
  #bossName{font-size:15px;font-weight:700;color:#ffb0a0;letter-spacing:.12em;text-shadow:0 1px 4px #000}
  #bossHp{height:14px;background:#2a0f0c;border:2px solid #ff8a70;border-radius:8px;overflow:hidden;margin-top:3px}
  #bossHpFill{height:100%;width:100%;background:linear-gradient(90deg,#e0503a,#ff9a7a)}
  #msg{top:38%;left:50%;transform:translateX(-50%);font-size:44px;font-weight:800;color:#fff;text-shadow:0 3px 12px #000;opacity:0;transition:opacity .2s;white-space:nowrap;text-align:center}
  #hint{bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:14px;color:#cfe8ff;opacity:.75;text-align:center}
  #gateBtn{bottom:calc(max(18px,env(safe-area-inset-bottom)) + 40px);left:50%;transform:translateX(-50%);display:none;pointer-events:auto;background:#ffd23f;color:#3a2a00;font-weight:800;font-size:22px;padding:14px 26px;border-radius:40px;border:0;box-shadow:0 6px 20px #0008}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#07090ccc;backdrop-filter:blur(8px);gap:16px;padding:24px;box-sizing:border-box;overflow:auto}
  .screen.hidden{display:none}
  h1.title{font-size:min(84px,13vw);line-height:.9;margin:0;font-weight:800;background:linear-gradient(180deg,#fff,#8fd6ff 60%,#2f8fd6);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
  .sub{font-size:15px;color:#a9c7e0;margin-top:-8px}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .chr{width:112px;padding:10px 6px;border-radius:12px;background:#121820;border:2px solid #263140;text-align:center;font-weight:700;font-size:13px;cursor:pointer}
  .chr.sel{border-color:#8fd6ff;background:#173048}
  .chr .ic{width:64px;height:64px;border-radius:50%;margin:0 auto 6px;border:3px solid #fff3}
  .chr small{display:block;font-weight:500;color:#9fb8cf;font-size:11px;margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(5,64px);gap:10px}
  .st{width:64px;height:64px;border-radius:12px;background:#121820;border:2px solid #263140;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:26px;cursor:pointer}
  .st.lock{opacity:.35;cursor:default}
  .st.sel{border-color:var(--yellow)}
  .st .stars{font-size:11px;color:var(--yellow);letter-spacing:1px;margin-top:-2px}
  .btn{pointer-events:auto;cursor:pointer;border:0;border-radius:40px;padding:14px 34px;font-size:22px;font-weight:800;background:var(--blue);color:#fff;box-shadow:0 8px 24px #0008}
  .btn.ghost{background:#ffffff18;color:#cfe8ff;font-size:16px;padding:10px 22px}
  .stat{display:flex;gap:26px;font-size:15px;color:#cfe8ff}
  .stat b{display:block;font-size:24px;color:#fff}
  #resTitle{font-size:64px;margin:0}
  #resStars{font-size:44px;color:var(--yellow);letter-spacing:6px}
  .credits{max-width:520px;font-size:13px;color:#a9c7e0;line-height:1.6;text-align:left}
</style>
</head>
<body>
<div id="hud">
  <div id="stageLbl" class="disp">STAGE 1</div>
  <div id="prog"><div id="progFill"></div></div>
  <div id="troops"><div id="troopsN" class="disp">10</div><div id="weapon" class="disp">RIFLE</div></div>
  <div id="coins" class="disp">🪙 0</div>
  <div id="bossBar"><div id="bossName" class="disp">BRUTE</div><div id="bossHp"><div id="bossHpFill"></div></div></div>
  <div id="msg" class="disp"></div>
  <div id="hint">◀ 스와이프 / ←→ 로 레인 선택 ▶</div>
  <button id="gateBtn" class="disp">🔓 탭 연타!</button>
</div>

<div id="menu" class="screen">
  <h1 class="title disp">Zombie Surge</h1>
  <div class="sub">10개의 미션 — 병력을 키워 좀비 웨이브를 돌파하라</div>
  <div class="row" id="chars"></div>
  <div class="grid" id="stages"></div>
  <div class="row"><button class="btn disp" id="playBtn">▶ 출격</button><button class="btn ghost disp" id="creditsBtn">Credits</button></div>
</div>

<div id="result" class="screen hidden">
  <h1 id="resTitle" class="title disp">Mission Clear</h1>
  <div id="resStars">★★★</div>
  <div class="stat"><div>병력<b id="rTroops">0</b></div><div>최대 병력<b id="rPeak">0</b></div><div>좀비 처치<b id="rKills">0</b></div><div>시간<b id="rTime">0s</b></div><div>코인<b id="rCoins">0</b></div></div>
  <div class="row"><button class="btn disp" id="nextBtn">다음 스테이지 ▶</button><button class="btn ghost disp" id="retryBtn">다시</button><button class="btn ghost disp" id="menuBtn">메뉴</button></div>
</div>

<div id="credits" class="screen hidden">
  <h1 class="title disp" style="font-size:48px">Credits</h1>
  <div class="credits" id="creditsBody"></div>
  <button class="btn ghost disp" id="creditsClose">닫기</button>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
