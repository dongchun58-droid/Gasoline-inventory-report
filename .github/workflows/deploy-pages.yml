name: Deploy games to Pages

# 두 앱을 하나의 Pages 사이트로 합성 배포:
#   turbo-sprint/dist  → site/          (루트 — 기존 링크 유지)
#   zombie-surge/dist  → site/zombie/   (ZOMBIE SURGE)
on:
  push:
    branches: [main]   # main에서만 배포 (동시성 레이스 방지)
    paths:
      - 'turbo-sprint/**'
      - 'zombie-surge/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build TURBO SPRINT
        working-directory: turbo-sprint
        run: |
          npm ci
          npm run build
      - name: Build ZOMBIE SURGE
        working-directory: zombie-surge
        run: |
          npm ci
          npm run build
      - name: Compose site
        run: |
          rm -rf site && mkdir -p site/zombie
          cp -r turbo-sprint/dist/. site/
          cp -r zombie-surge/dist/. site/zombie/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
